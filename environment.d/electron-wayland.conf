# Run Electron apps natively on Wayland instead of XWayland.
#
# Under XWayland a window cannot receive input synthesised through the Wayland
# virtual-keyboard protocol (wtype), which is what the on-screen keyboard plugin
# types with, so keystrokes were silently dropped.
#
# Electron reads this itself, so it covers every launch path — desktop entry,
# keybinding, URL handler, bare command — and every Electron app, rather than
# needing --ozone-platform flags repeated per app.
ELECTRON_OZONE_PLATFORM_HINT=wayland
