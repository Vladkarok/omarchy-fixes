# Run natively on Wayland instead of XWayland.
#
# ELECTRON_OZONE_PLATFORM_HINT (see ~/.config/environment.d/electron-wayland.conf)
# is not enough here: the app appends --ozone-platform=x11 to its own command
# line, and a command-line switch beats the env hint. Passing the flag back
# explicitly is the only way to win.
#
# Under XWayland the window cannot receive input synthesised through the
# Wayland virtual-keyboard protocol (wtype), which is what the on-screen
# keyboard plugin types with, so keystrokes were silently dropped.
#
# Read by Omarchy's /usr/bin/chatgpt launcher (openai-codex-desktop), so it
# applies to both the stock entry and the ChatGPT-Second.desktop override.
--ozone-platform=wayland
--ozone-platform-hint=wayland
--enable-features=UseOzonePlatform,WaylandWindowDecorations
