# /etc/pacman.d/custom-repos.conf
#
# Locally patched builds (hyprland, hyprpm, remmina). The pre-refresh-pacman
# hook includes this file above [omarchy], so this is the first repository.
#
# pacman takes a package from the first repository that lists its name,
# whatever the version (pacman.conf(5), REPOSITORY SECTIONS). While a name is
# listed here, neither `omarchy update` (-Syu) nor a channel switch (-Syyuu)
# replaces it with an Arch or Omarchy build, newer or older. The cost: newer
# upstream builds stay hidden until you rebuild and publish one here.
#
# The packages are unsigned. Optional accepts unsigned databases and
# packages and still rejects a bad signature. TrustAll only changes how
# signatures are judged, so it adds nothing for unsigned packages. Only root
# can write the directory, so only root can add packages to this repository.
#
# The directory must be readable by pacman's DownloadUser (alpm), which
# rules out a path under /home (Arch news, 2024-09-14, pacman 7.0.0).
#
# Remove the Include line from /etc/pacman.conf before deleting this file:
# pacman refuses to run if an Include points at a missing file.

[local-patched]
SigLevel = Optional
Server = file:///var/lib/local-patched-repo
