include ~/.local/state/omarchy/current/theme/kitty.conf

# Font
font_family CaskaydiaMono Nerd Font
font_size 12.0

# Window
window_padding_height 14
show_window_resize_notification no

# Keybindings
map F11 toggle_fullscreen
# Re-send Ctrl+C/V as latin: kitty-protocol TUIs (codex, neovim) otherwise get Ctrl+с/м on the UA layout.
# User maps only fall back to the shifted key by default; ascii is needed to match on UA at all.
map --allow-fallback=ascii ctrl+c send_key ctrl+c
map --allow-fallback=ascii ctrl+v send_key ctrl+v

# Allow remote access
single_instance yes
# allow_remote_control yes

copy_on_select yes

# notifications for long-running commands
notify_on_cmd_finish invisible 3.0

# cursor customization
# block / beam / underline
cursor_shape block
cursor_stop_blinking_after 0

# tab bar customization
tab_bar_style powerline
tab_powerline_style angled
tab_bar_edge top
tab_bar_align left
active_tab_font_style   bold
inactive_tab_font_style normal
tab_title_template "[{index}] {title}{' ◆' if layout_name == 'stack' and num_windows > 1 else ''}"
tab_switch_strategy left

# tab bar enhancements
tab_bar_min_tabs 1
tab_bar_margin_height 2.0 0.0


pixel_scroll yes
